message BattleLib_Bootstrap {
	enum RemoteControl {
		INVALID = 0;
		CLIENT_READY = 1;
		SERVER_FINISHED_PROCESSING_RESULTS = 2;
		ALL_CLIENTS_READY = 3;
		EMOTE = 4;
		BATTLE_SPEED = 5;
		SERVER_SOCKET_FAILURE = 6;
		FORFEIT = 7;
	}

	message Ability {
		string name_key = 1;
		string icon = 2;
		uint32 mana_cost = 3;
		bool activated = 4;
		uint32 level = 5;
		uint32 shape = 6;
		float shape_length = 7;
		float shape_width = 8;
		float shape_angle = 9;
		bool target_self = 10;
		bool target_ally = 11;
		bool target_enemy = 12;
		uint32 add_unit_max_count = 13;
		BattleLib_Bootstrap.Unit add_unit = 14;
		uint64 geo_id = 15;
		float range = 16;
		uint32 id = 17;
		uint32 cast_area = 18;
		bool is_alternate = 19;
		string desc_key = 20;
		bool preview_strength = 21;
		bool ignore_buildings = 22;
		uint32 initial_mana = 23;
		uint32 ability_type = 24;
		uint64 battle_granted_id = 25;
		repeated float balance_vars = 26 [packed=false];
		uint32 sort_order = 27;
		string special_icon_path = 28;
	}

	message BattleChoice {
		uint64 id = 1;
		string offer_description = 2;
		string offer_image = 3;
		string offer_accepted_info_icon = 4;
		string offer_accepted_info_name = 5;
		string offer_accepted_info_description = 6;
		string progress_description = 7;
		string expire_duration_remaining_description = 8;
		string offer_description_accept = 9;
		string offer_description_decline = 10;
	}

	message BattleValue {
		uint32 key = 1;
		int64 value = 2;
	}

	message Encounter {
		string id = 1;
		float x = 2;
		float y = 3;
		uint32 num_lanes = 4;
		uint32 grid_gap = 5;
		string cinematic = 6;
		float verticality = 7;
		repeated BattleLib_Bootstrap.BattleChoice battle_choices = 8 [packed=false];
		string exit_cinematic = 9;
		string entry_cinematic = 10;
	}

	message Environment {
		repeated string prefabs = 1 [packed=false];
		BattleLib_Bootstrap.Map map = 2;
		repeated BattleLib_Bootstrap.SpawnPoint spawn_points = 3 [packed=false];
		string vfx_prefab = 4;
	}

	message Map {
		float width = 1;
		float height = 2;
		float grid_scale = 3;
		repeated BattleLib_Bootstrap.Encounter encounters = 4 [packed=false];
		repeated BattleLib_Bootstrap.Obstruction obstructions = 5 [packed=false];
	}

	message MutatorData {
		uint64 mutator = 1;
		repeated uint64 unit_id_list = 2 [packed=false];
	}

	message Obstruction {
		uint32 xstart = 1;
		uint32 xend = 2;
		uint32 y = 3;
	}

	message Player {
		uint64 ai_content_id = 1;
		repeated BattleLib_Bootstrap.Squad squads = 2 [packed=false];
		bool is_human = 3;
		uint32 player_id = 4;
		uint32 team_id = 5;
		repeated BattleLib_Bootstrap.Spell spells = 6 [packed=false];
		repeated BattleLib_ActivityTracker activity_trackers = 7 [packed=false];
		uint32 player_level = 8;
		bool enable_auto = 9;
		repeated uint64 emotes = 10 [packed=false];
		string client_version = 11;
	}

	message RaidUnitStatus {
		uint64 definition_id = 1;
		float health_percent = 2;
	}

	message SpawnPoint {
		uint32 team_id = 1;
		uint32 unit_type = 2;
		float x = 3;
		float y = 4;
	}

	message Spell {
		uint64 definition_id = 1;
		repeated uint64 effect_def_ids = 2 [packed=false];
		BattleLib_Bootstrap.Ability ability = 3;
		uint32 power_rating = 4;
	}

	message Squad {
