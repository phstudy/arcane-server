[project]
name = "arcane-server"
version = "0.2.1"
description = "Game server for the v29 client of a discontinued mobile game"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "lz4>=4.4.5",
    "pillow>=13.0.0",
    "protobuf>=6.32",
    "segno>=1.6.6",
]

[project.optional-dependencies]
# News page art (news_art.py): textures from the content set's bundles.
art = [
    "UnityPy>=1.20",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "unitypy>=1.20",
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.5.0",
    "zxing-cpp>=3.1.1",
    "pytest-xdist>=3.8.0",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto --dist worksteal"
testpaths = ["tests"]
